<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--ARTIFACT-START-->
<title>Docker no Codespaces</title>
<meta name="description" content="Aprenda Docker desde os primeiros comandos, com explicações em português e 16 desafios no GitHub Codespaces. Não é preciso saber programar.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#111214; --panel:#18191D; --panel-2:#1F2126; --ink:#F2F1EC; --ink-2:#C9C7BE; --muted:#8B8A82;
  --accent:#FF8C42; --accent-ink:#2A1200; --accent-soft:rgba(255,140,66,.12);
  --line:#2A2C33; --line-2:#3A3D46; --blue:#6FB1FF; --amber:#F2C14E; --red:#F07A7A; --green:#8FD9A8;
  --display:"Space Grotesk","Inter","Segoe UI",Helvetica,Arial,sans-serif;
  --body:"Inter","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:"JetBrains Mono","IBM Plex Mono",Menlo,Consolas,monospace;
  --r:10px; --r-s:6px;
  --gutter:clamp(20px,4vw,56px);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:clamp(15px,1.12vw,18.5px);line-height:1.6;min-height:100vh;-webkit-font-smoothing:antialiased}
a{color:var(--accent)}
a:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:var(--r-s)}
code,pre,kbd{font-family:var(--mono)}
code{background:var(--panel-2);border-radius:4px;padding:.08em .4em;font-size:.9em;color:var(--accent);white-space:nowrap}
h1,h2,h3{font-family:var(--display);font-weight:600;letter-spacing:-.015em;line-height:1.15;margin:0;text-wrap:balance}
p{margin:0}
strong{font-weight:600;color:var(--ink)}
::selection{background:var(--accent);color:var(--accent-ink)}
.mono{font-family:var(--mono)}
.up{font-family:var(--mono);text-transform:uppercase;letter-spacing:.1em;font-size:.7em;color:var(--muted)}
.hidden{display:none!important}

/* ---------- Home ---------- */
#home{padding:var(--gutter);padding-block:clamp(32px,6vh,80px);max-width:1280px;margin:0 auto}
.hero{display:grid;grid-template-columns:1fr auto;gap:32px;align-items:end;padding-bottom:clamp(24px,4vh,40px);border-bottom:1px solid var(--line)}
.hero h1{font-size:clamp(38px,5.5vw,72px);font-weight:700;line-height:1.02}
.hero h1 span{display:block;color:var(--accent);font-weight:500}
.hero .sub{color:var(--ink-2);max-width:58ch;margin-top:18px;font-size:1.05em}
.hero .meta{display:flex;gap:28px;font-family:var(--mono);font-size:.78em;color:var(--muted);text-align:left}
.hero .meta b{display:block;color:var(--ink);font-size:1.9em;font-family:var(--display);font-weight:600;line-height:1.1;margin-bottom:2px}
.legend{display:flex;flex-wrap:wrap;gap:10px 28px;margin:24px 0 20px;font-family:var(--mono);font-size:.78em;color:var(--muted);align-items:center}
.legend .sw{display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--line-2);vertical-align:0;margin-right:8px}
.legend .sw.el{background:var(--amber)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.tile{position:relative;display:grid;grid-template-rows:auto 1fr auto;gap:14px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);padding:20px;color:var(--ink);text-decoration:none;min-height:180px;transition:border-color .15s ease,background .15s ease}
.tile:hover,.tile:focus-visible{border-color:var(--accent);background:var(--panel-2);outline:none}
.tile .num{font-family:var(--mono);font-size:.82em;color:var(--accent);letter-spacing:.06em}
.tile .row{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.tile .mod{font-family:var(--mono);font-size:.68em;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);text-align:right;line-height:1.4}
.tile h3{font-size:clamp(18px,1.4vw,21px);font-weight:600;line-height:1.25}
.tile .cmds{font-family:var(--mono);font-size:.76em;color:var(--muted);line-height:1.6}
.tile .foot{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:12px;font-family:var(--mono);font-size:.72em;color:var(--muted)}
.tile.el::after{content:"";position:absolute;top:22px;right:20px;width:8px;height:8px;border-radius:50%;background:var(--amber)}
.tile.el .mod{padding-right:16px}
.homefoot{margin-top:40px;display:flex;flex-wrap:wrap;gap:10px 32px;font-family:var(--mono);font-size:.76em;color:var(--muted);border-top:1px solid var(--line);padding-top:18px}
.homefoot a{color:var(--ink-2)}
kbd{display:inline-block;border:1px solid var(--line-2);border-radius:4px;padding:0 6px;font-size:.9em;color:var(--ink-2);line-height:1.6;margin:0 2px;background:var(--panel)}

/* ---------- Deck ---------- */
#deck{min-height:100vh;display:grid;grid-template-rows:auto 1fr auto;grid-template-columns:minmax(0,1fr)}
.rail{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px var(--gutter);border-bottom:1px solid var(--line);background:rgba(17,18,20,.92);backdrop-filter:blur(8px);font-family:var(--mono);font-size:.78em;position:sticky;top:0;z-index:5}
.rail.bottom{border-bottom:0;border-top:1px solid var(--line);position:sticky;bottom:0}
.rail .crumb{color:var(--muted);text-align:center;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rail .crumb b{color:var(--ink-2);font-weight:500}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line-2);border-radius:var(--r-s);background:transparent;color:var(--ink-2);font-family:var(--mono);font-size:1em;padding:8px 14px;cursor:pointer;text-decoration:none;transition:border-color .15s,color .15s,background .15s;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{background:#FFA366;color:var(--accent-ink)}
.btn[disabled]{opacity:.3;pointer-events:none}
.counter{font-variant-numeric:tabular-nums;color:var(--muted)}
.dots{display:flex;gap:6px}
.dots i{width:18px;height:3px;border-radius:2px;background:var(--line-2);display:block}
.dots i.on{background:var(--accent)}
.slide{padding:clamp(28px,5vh,56px) var(--gutter);max-width:1200px;margin:0 auto;width:100%;animation:in .25s ease}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.slide,.tile,.btn{animation:none;transition:none}}
.slide .eyebrow{font-family:var(--mono);font-size:.74em;text-transform:uppercase;letter-spacing:.12em;color:var(--accent);margin-bottom:12px}
.slide h2{font-size:clamp(26px,3.4vw,44px);margin-bottom:clamp(20px,3.5vh,36px);font-weight:600}
.slide h3{font-size:clamp(15px,1.15vw,17px);font-weight:600;letter-spacing:0;margin-bottom:10px;color:var(--ink)}
.lead{font-size:clamp(17px,1.45vw,22px);max-width:60ch;line-height:1.5;color:var(--ink-2);font-weight:400}
.lead strong,.lead em{color:var(--ink)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:clamp(16px,2vw,28px);align-items:start}
.cols.w2{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.cols.s2{grid-template-columns:minmax(0,1.2fr) minmax(0,1fr)}
@media (max-width:820px){.cols.s2{grid-template-columns:1fr}}
/* minmax(0,…) e min-width:0: uma linha longa de comando rola dentro do bloco em vez de alargar a coluna */
.cols>*{min-width:0}
.stack{display:grid;grid-template-columns:minmax(0,1fr);gap:clamp(14px,2vh,22px)}
.box{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);padding:clamp(16px,1.6vw,22px)}
.box.lift{border-color:var(--line-2);background:var(--panel-2)}
.box.soft{background:transparent}
.box p{color:var(--ink-2)}
.box p+p{margin-top:.6em}
.callout{border-left:2px solid var(--accent);padding:4px 0 4px 16px;color:var(--ink-2)}
.callout.warn{border-left-color:var(--amber)}
.callout.warn strong{color:var(--amber)}
.callout strong{color:var(--accent)}
pre.cmd{margin:0;background:#0B0C0E;border:1px solid var(--line);border-radius:var(--r-s);padding:14px 16px;font-size:clamp(13px,1vw,15.5px);line-height:1.6;overflow-x:auto;color:var(--ink)}
pre.cmd .p{color:var(--accent);user-select:none}
pre.cmd .c{color:var(--muted)}
pre.cmd .o{color:var(--muted)}
pre.cmd .add{color:var(--green)}
pre.cmd .del{color:var(--red)}
pre.cmd .mk{color:var(--amber)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-family:var(--mono);font-size:.76em;border:1px solid var(--line-2);border-radius:999px;color:var(--ink-2);padding:4px 12px;background:transparent}
.chip.amber{border-color:var(--amber);color:var(--amber)}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:14px;counter-reset:s}
.steps li{display:grid;grid-template-columns:32px minmax(0,1fr);gap:12px;align-items:start;counter-increment:s}
.steps li::before{content:counter(s);font-family:var(--mono);font-size:.8em;color:var(--accent);border:1px solid var(--line-2);border-radius:50%;width:24px;height:24px;display:grid;place-items:center;margin-top:3px}
.steps li .t{margin-bottom:8px;color:var(--ink-2)}
.steps li>div{color:var(--ink-2)}
.steps pre.cmd{padding:10px 14px}
table.kv{width:100%;border-collapse:collapse;font-size:.94em}
table.kv th,table.kv td{text-align:left;padding:10px 10px;border-bottom:1px solid var(--line);vertical-align:top;color:var(--ink-2)}
table.kv tr:last-child td{border-bottom:0}
table.kv th{font-family:var(--mono);font-weight:400;text-transform:uppercase;letter-spacing:.1em;font-size:.7em;color:var(--muted)}
table.kv th:empty{padding:0;border:0}
table.kv td:first-child{font-family:var(--mono);color:var(--accent);white-space:nowrap;font-size:.9em}
.tw{overflow-x:auto}
ul.links{list-style:none;margin:0;padding:0;display:grid;gap:10px}
ul.links li{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:baseline}
ul.links li::before{content:"↗";color:var(--muted);font-family:var(--mono);font-size:.9em}
ul.links a{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--line-2)}
ul.links a:hover{color:var(--accent);border-bottom-color:var(--accent)}
ul.links small{display:block;color:var(--muted);font-family:var(--mono);font-size:.76em;margin-top:2px}
ul.plain{margin:0;padding-left:1.1em;display:grid;gap:6px;color:var(--ink-2)}
.big{font-family:var(--mono);font-size:.8em;color:var(--accent);letter-spacing:.1em}
.big::before{content:"Desafio "}
details{border:1px solid var(--line-2);border-radius:var(--r);padding:12px 16px}
details summary{cursor:pointer;font-family:var(--mono);color:var(--amber);letter-spacing:.04em;font-size:.8em}
details[open] summary{margin-bottom:10px}

/* Flow diagrams (imagem → container, portas, redes) */
.flow{display:flex;flex-wrap:wrap;align-items:stretch;gap:10px;justify-content:center}
.flow .node{flex:1 1 150px;min-width:150px;border:1px solid var(--line-2);border-radius:var(--r);background:var(--panel);padding:14px;display:grid;gap:4px;align-content:center;text-align:center}
.flow .node b{font-family:var(--display);font-weight:600;font-size:.98em;color:var(--ink)}
.flow .node small{color:var(--muted);font-family:var(--mono);font-size:.72em;line-height:1.4}
.flow .node.hi{border-color:var(--accent);background:var(--accent-soft)}
.flow .node.blue{border-color:var(--blue)}
.flow .node.dim{border-color:var(--line);color:var(--muted)}
.flow .node.warn{border-color:var(--amber);border-style:dashed}
.flow .arr{flex:0 0 auto;display:grid;place-items:center;font-family:var(--mono);font-size:.72em;color:var(--muted);text-align:center;padding:0 6px;gap:2px}
.flow .arr strong{color:var(--accent);font-weight:500}
.flow .arr .a{font-size:1.6em;line-height:1;color:var(--accent)}
.flow .arr.back .a{color:var(--amber)}
.flow.vert{flex-direction:column}
.flow.vert .node{flex-basis:auto}
@media (max-width:640px){.flow{flex-direction:column}.flow .arr .a{transform:rotate(90deg)}}
/* a caixa "rede": um grupo de nós com borda tracejada e rótulo */
.netbox{border:1px dashed var(--line-2);border-radius:var(--r);padding:26px 14px 14px;position:relative;margin-top:10px}
.netbox::before{content:attr(data-label);position:absolute;top:-10px;left:14px;background:var(--bg);padding:0 8px;font-family:var(--mono);font-size:.72em;color:var(--accent);letter-spacing:.08em;text-transform:uppercase}

/* Camadas de imagem empilhadas */
.layers{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);padding:12px 14px}
.layers .cap{font-family:var(--mono);font-size:.72em;color:var(--muted);letter-spacing:.04em;margin-bottom:8px}
.layers .stk{display:grid;gap:4px}
.layer{border:1px solid var(--line-2);border-radius:var(--r-s);background:var(--panel-2);padding:9px 14px;display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.layer b{font-family:var(--mono);font-size:.84em;color:var(--ink);font-weight:500;white-space:nowrap}
.layer small{color:var(--muted);font-family:var(--mono);font-size:.7em;text-align:right;line-height:1.35}
.layer.hi{border-color:var(--accent);background:var(--accent-soft)}
.layer.rw{border-style:dashed;border-color:var(--amber);background:transparent}
.layer.rw b{color:var(--amber)}
.layer.dim{opacity:.55}
.layer .tg{font-family:var(--mono);font-size:.66em;padding:1px 8px;border-radius:999px;border:1px solid var(--line-2);color:var(--muted);letter-spacing:.06em;white-space:nowrap}
.layer .tg.ok{border-color:var(--green);color:var(--green)}
.layer .tg.redo{border-color:var(--red);color:var(--red)}
.layers .base{font-family:var(--mono);font-size:.7em;color:var(--muted);text-align:center;margin-top:6px;letter-spacing:.06em}

/* Linha do tempo (introdução) */
svg.tl{width:100%;height:auto;display:block;max-width:100%;font-family:var(--mono)}
svg.tl line{stroke:var(--line-2);stroke-width:2}
svg.tl circle{fill:var(--panel-2);stroke:var(--ink-2);stroke-width:2}
svg.tl .hi circle{fill:var(--accent);stroke:var(--accent)}
svg.tl .hi text{fill:var(--accent-ink)}
svg.tl .end circle{fill:var(--blue);stroke:var(--blue)}
svg.tl .end text{fill:var(--bg)}
svg.tl text{fill:var(--ink);font-size:11px;text-anchor:middle;font-weight:500}
svg.tl text.cap{fill:var(--muted);font-size:12px;font-weight:400}
svg.tl text.title{fill:var(--accent);font-size:15px;font-weight:600}
.gwrap{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);padding:12px 14px}
</style>
</head>
<body>
<main id="home"></main>
<main id="deck" class="hidden">
  <div class="rail">
    <a class="btn" href="#/" id="btnHome">← Desafios</a>
    <div class="crumb" id="crumb"></div>
    <div class="counter" id="counter"></div>
  </div>
  <section class="slide" id="slide"></section>
  <div class="rail bottom">
    <button class="btn" id="btnPrev">← Anterior</button>
    <div class="dots" id="dots"></div>
    <button class="btn primary" id="btnNext">Próximo →</button>
  </div>
</main>

<script>
/* ---------- helpers ---------- */
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

// Command block: lines starting with "$ " become prompt lines; "# " comment lines; "+ "/"- " diff lines; "> " output lines.
function cmd(text){
  const lines = text.replace(/^\n/,'').replace(/\n\s*$/,'').split('\n');
  return '<pre class="cmd">' + lines.map(l=>{
    if (l.startsWith('$ ')) return '<span class="p">$ </span>' + esc(l.slice(2));
    if (/^\s*#/.test(l)) return '<span class="c">' + esc(l) + '</span>';
    if (l.startsWith('+ ')) return '<span class="add">' + esc(l) + '</span>';
    if (l.startsWith('- ')) return '<span class="del">' + esc(l) + '</span>';
    if (l.startsWith('> ')) return '<span class="o">' + esc(l.slice(2)) + '</span>';
    return esc(l);
  }).join('\n') + '</pre>';
}

// Camadas de uma imagem, empilhadas: a primeira da lista fica em cima.
// items: [{t:'COPY . .', s:'o seu código', cls:'hi'|'rw'|'dim', tag:'CACHED', tagCls:'ok'|'redo'}]
function layers(items, cap='', base=''){
  return `<div class="layers">${cap?`<div class="cap">${cap}</div>`:''}<div class="stk">` +
    items.map(i=>`<div class="layer ${i.cls||''}"><b>${esc(i.t)}</b>${i.tag?`<span class="tg ${i.tagCls||''}">${esc(i.tag)}</span>`:''}${i.s?`<small>${i.s}</small>`:''}</div>`).join('') +
    `</div>${base?`<div class="base">${base}</div>`:''}</div>`;
}

// navegador → Codespace:host → container:cont
function ports(host, cont, o={}){
  const {app='uvicorn', quem='navegador / curl'} = o;
  return `<div class="flow">
    <div class="node"><b>${quem}</b><small>curl: localhost:${host} · navegador: endereço da aba PORTS</small></div>
    <div class="arr"><span class="a">→</span><strong>-p ${host}:${cont}</strong></div>
    <div class="node hi"><b>Codespace :${host}</b><small>porta da máquina que executa o Docker</small></div>
    <div class="arr"><span class="a">→</span>encaminha</div>
    <div class="node"><b>container :${cont}</b><small>${app} recebe os pedidos nesta porta</small></div>
  </div>`;
}

// registro → imagem → container
function imgflow(o={}){
  const {hi='cont', pull='docker pull · baixa a imagem', run='docker run · cria e inicia'} = o;
  const n=(k,t,s)=>`<div class="node ${hi===k?'hi':''}"><b>${t}</b><small>${s}</small></div>`;
  return `<div class="flow">
    ${n('reg','Registro','Docker Hub · onde as imagens ficam publicadas')}
    <div class="arr"><span class="a">→</span>${pull}</div>
    ${n('img','Imagem','programa e arquivos prontos para criar containers')}
    <div class="arr"><span class="a">→</span>${run}</div>
    ${n('cont','Container','ambiente criado a partir da imagem para executar o programa')}
  </div>`;
}

function docs(items){
  return '<p style="margin-bottom:14px;color:var(--muted)">Links para consultar depois. A documentação do Docker está em inglês.</p><ul class="links">' + items.map(i=>`<li><div><a href="${i.href}" target="_blank" rel="noopener">${i.t}</a>${i.s?`<small>${i.s}</small>`:''}</div></li>`).join('') + '</ul>';
}
function kv(rows, head=['Comando','Para quê']){
  return `<div class="tw"><table class="kv"><thead><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>` +
    rows.map(r=>`<tr>${r.map((c,i)=>`<td>${i===0?`<code>${esc(c)}</code>`:c}</td>`).join('')}</tr>`).join('') + '</tbody></table></div>';
}
function steps(items){ return '<ol class="steps">' + items.map(i=>`<li><div>${i}</div></li>`).join('') + '</ol>'; }
function chips(list, cls=''){ return `<div class="chips">${list.map(c=>`<span class="chip ${cls}">${esc(c)}</span>`).join('')}</div>`; }

// Standard cover slide for a desafio.
function cover(d, objetivo, onde, extra=''){
  return `<div class="cols s2"><div class="stack">
    <div class="big">${String(d.n).padStart(2,'0')}</div>
    <p class="lead">${objetivo}</p>
    ${chips(d.cmds)}
    ${extra}
  </div><div class="stack">
    <div class="box lift"><h3>Onde fazer</h3>${onde}</div>
    <div class="box soft"><h3>Para este desafio</h3>${kv([['⏱ tempo', `${d.time} min${d.el?' · pode ficar para depois da aula':''}`],['módulo', d.mod],['verificação', `<code>check.sh ${String(d.n).padStart(2,'0')}</code>`]], ['',''])}</div>
  </div></div>`;
}
const qualquer = '<p>No terminal do Codespace, em <strong>qualquer pasta</strong>. Estes comandos usam recursos gerenciados pelo Docker e não dependem de arquivos da pasta atual.</p>';
</script>
<script>
/* ---------- doc links ---------- */
const DD = 'https://docs.docker.com/';
const CLI = c => DD + 'reference/cli/docker/' + c + '/';
const HUB = i => 'https://hub.docker.com/_/' + i;
const L = {

    {h:'Olá, container', body: cover({n:1,time:5,el:false,mod:'Módulo 1 · Fundamentos',cmds:['docker run <imagem> <comando>','docker ps','docker ps -a','docker images']},
      'Executar um programa Python <strong>dentro de um container</strong> e comparar a imagem usada como base com os containers criados a partir dela.',
      qualquer + '<p style="margin-top:10px;color:var(--muted)">Continue depois de concluir o desafio 0. Não é preciso preparar arquivos para este exercício.</p>')},
    {h:'Qual é a diferença entre imagem e container?', eyebrow:'Conceito', body:`
      <div class="stack">
        ${imgflow()}
        <div class="cols s2">
          ${layers([
            {t:'camada gravável', s:'arquivos próprios do container · apagados ao removê-lo', cls:'rw'},
            {t:'python:3.12-slim', s:'Python 3.12 instalado', cls:'hi'},
            {t:'debian:bookworm-slim', s:'um Debian mínimo'},
          ], 'arquivos do container: base da imagem e alterações próprias', 'a imagem-base pode ser usada por vários containers')}
          <div class="stack">
            <div class="box lift"><h3>Como ler o comando</h3>${cmd('$ docker run python:3.12-slim python -c "print(\'Olá, Docker!\')"\n#          └── imagem ──────┘ └──── comando executado lá dentro ────┘')}<p style="margin-top:10px"><code>python</code> é o nome da imagem; <code>3.12-slim</code> é a <strong>tag</strong>, um rótulo de versão ou variante. Sem tag, o Docker usa <code>latest</code>.</p><p>Python é uma linguagem de programação. Neste exemplo, <code>-c</code> pede que ela execute o texto entre aspas, e <code>print</code> mostra a mensagem na tela.</p></div>
            <div class="callout"><strong>docker run sempre cria um container novo.</strong> Rodou três vezes, três containers. Quando o comando termina, o container <em>para</em>, mas continua existindo (<code>docker ps -a</code>) até ser removido.</div>
          </div>
        </div>
      </div>`},
    {h:'O desafio', eyebrow:'Tarefa · 5 min', body:`
      <div class="cols s2"><div class="stack">${steps([
        `<div class="t">Execute o teste novamente. Como a imagem já está disponível, não devem aparecer mensagens de download, como <em>Pulling</em>. O Docker cria um novo container:</div>${cmd('$ docker run hello-world')}`,
        `<div class="t">Um container com Python dentro. O que vem depois da imagem é o comando a executar lá:</div>${cmd('$ docker run python:3.12-slim python -c "print(\'Olá, Docker!\')"')}`,
        `<div class="t">Liste os containers em execução e, depois, todos os containers. Os dois programas já terminaram, mas seus containers aparecem na segunda lista:</div>${cmd('$ docker ps\n$ docker ps -a')}`,
        `<div class="t">Agora liste as imagens disponíveis:</div>${cmd('$ docker images')}`,
      ])}</div><div class="stack">
        <div class="box"><h3>Verificação</h3>${cmd('$ check.sh 01')}<p style="margin-top:10px;color:var(--muted)">Aprova com um container do <code>hello-world</code> e um do <code>python:3.12-slim</code> rodando um <code>print</code>.</p></div>
        <div class="callout"><strong>Como ler a lista:</strong> IMAGE é a imagem; COMMAND, o comando; STATUS, o estado; e NAMES, o nome. <code>Exited (0)</code> significa que o programa terminou sem erro. Cada <code>docker run</code> acrescenta um container.</div>
        <div class="box soft"><h3>Missão extra</h3>${cmd('$ docker run python:3.12-slim cat /etc/os-release\n$ cat /etc/os-release')}<p style="margin-top:8px;color:var(--muted)"><code>cat</code> mostra o conteúdo do arquivo. Compare as distribuições Linux do container e do Codespace: seus arquivos podem ser diferentes, mesmo compartilhando o kernel.</p></div>
      </div></div>`},
    {h:'Comandos e documentação', eyebrow:'Referência', body:`
      <div class="cols s2">
        ${kv([
          ['docker run <imagem> [comando]','cria um container novo e roda o comando (ou o padrão da imagem)'],
          ['docker ps','containers rodando agora'],
          ['docker ps -a','todos, inclusive os parados'],
          ['docker images','imagens baixadas ou construídas nesta máquina'],
          ['docker pull <imagem>','só baixa, sem rodar (o run faz isso sozinho na primeira vez)'],
          ['docker rm <container>','remove um container parado (desafio 3)'],
        ])}
        <div class="box soft"><h3>Documentação</h3>${docs([L.c_img, L.c_cont, L.c_reg, L.r_run, L.r_ps, L.r_images, L.h_python])}</div>
      </div>`},
  ]});

D.push({n:2, key:'02', title:'Dentro do container', mod:'Módulo 1 · Fundamentos', time:5, el:false, cmds:['docker run -it','--rm','--name','docker start -ai'],
  slides:[
    {h:'Dentro do container', body: cover({n:2,time:5,el:false,mod:'Módulo 1 · Fundamentos',cmds:['docker run -it --rm','docker run -it --name','exit','docker start -ai']},
      'Digitar comandos dentro de um container e criar um arquivo nele. Depois, verificar que esse arquivo <strong>não aparece em outro container</strong> criado a partir da mesma imagem.',
      qualquer)},
    {h:'Cada container, seu sistema de arquivos', eyebrow:'Conceito', body:`
      <div class="stack">
        <div class="cols w2">
          ${layers([
            {t:'explorador · camada gravável', s:'/marca.txt está aqui', cls:'rw'},
            {t:'python:3.12-slim', s:'só leitura', cls:'dim'},
          ], 'container "explorador"')}
          ${layers([
            {t:'outro container · camada gravável', s:'vazia: /marca.txt não existe', cls:'rw'},
            {t:'python:3.12-slim', s:'a mesma imagem, compartilhada', cls:'dim'},
          ], 'docker run --rm python:3.12-slim cat /marca.txt')}
        </div>
        <div class="cols">
          <div class="box lift"><h3>As opções de hoje</h3>${kv([
            ['-i','permite enviar o que você digita para o programa no container'],
            ['-t','fornece um terminal para essa interação; aqui, usamos as duas opções juntas: -it'],
            ['--rm','remove o container assim que ele terminar. Ideal para experiências'],
            ['--name x','nome fixo em vez de um aleatório; facilita todos os comandos seguintes'],
          ], ['Opção','Efeito'])}</div>
          <div class="stack">
            <div class="callout"><strong>Parar e remover são ações diferentes.</strong> Sem <code>--rm</code>, sair com <code>exit</code> para o container e mantém seus arquivos. <code>docker start -ai explorador</code> inicia o mesmo container e permite interagir com ele novamente.</div>
            <div class="callout"><strong>Para sair neste exercício:</strong> use <code>exit()</code> no Python e <code>exit</code> no Bash. Para desconectar o terminal sem parar um container interativo, use <kbd>Ctrl+P</kbd> e depois <kbd>Ctrl+Q</kbd>.</div>
          </div>
        </div>
      </div>`},
    {h:'O desafio', eyebrow:'Tarefa · 5 min', body:`
      <div class="cols s2"><div class="stack">${steps([
        `<div class="t">Abra o Python interativo. Quando aparecer <code>&gt;&gt;&gt;</code>, digite <code>import platform; platform.platform()</code> para ver informações do sistema. Saia com <code>exit()</code>. De volta ao Codespace, <code>docker ps -a</code> confirma que <code>--rm</code> removeu esse container.</div>${cmd('$ docker run -it --rm python:3.12-slim')}`,
        `<div class="t">Abra o <strong>Bash</strong>, um interpretador de comandos, também chamado de <em>shell</em>. Depois da primeira linha, os comandos serão executados <strong>dentro do container</strong>:</div>${cmd('$ docker run -it --name explorador python:3.12-slim bash\n$ cat /etc/os-release\n$ ls /\n$ hostname\n$ python --version')}`,
        `<div class="t">Ainda dentro do container, crie um arquivo e saia. O símbolo <code>&gt;</code> grava o texto produzido por <code>echo</code> no arquivo indicado:</div>${cmd('$ echo "eu estive aqui" > /marca.txt\n$ exit')}`,
        `<div class="t">De volta ao Codespace, tente ler o arquivo em <strong>outro</strong> container. O erro <em>No such file or directory</em> é esperado: o arquivo existe apenas no <code>explorador</code>.</div>${cmd('$ docker run --rm python:3.12-slim cat /marca.txt')}`,
      ])}</div><div class="stack">
        <div class="box"><h3>Verificação</h3>${cmd('$ check.sh 02')}<p style="margin-top:10px;color:var(--muted)">Execute no terminal do Codespace. A verificação procura o arquivo no <code>explorador</code> e avisa se faltou remover o container do Python interativo.</p></div>
        <div class="box soft"><h3>Missão extra</h3>${cmd('$ docker start -ai explorador\n$ cat /marca.txt\n$ exit')}<p style="margin-top:8px;color:var(--muted)">O arquivo continua lá. Parar o container preserva sua camada de arquivos; removê-lo com <code>docker rm</code> apaga essa camada.</p></div>
      </div></div>`},
    {h:'Comandos e documentação', eyebrow:'Referência', body:`
      <div class="cols s2">
        ${kv([
          ['docker run -it --rm <imagem> bash','abre o Bash, se disponível na imagem, em um container temporário'],
          ['docker run -it --name <nome> <imagem> <cmd>','interativo, com nome, e fica depois de sair'],
          ['docker start -ai <nome>','inicia um container parado e permite interagir com ele pelo terminal'],
          ['docker exec -it <nome> bash','abre outro Bash em um container que já está rodando (desafio 9)'],
          ['docker cp <nome>:/arquivo .','copia um arquivo de dentro do container (mesmo parado)'],
        ])}
        <div class="box soft"><h3>Documentação</h3>${docs([L.c_cont, L.r_run, L.r_start, L.r_exec, L.r_cp])}</div>
      </div>`},
  ]});
</script>

D.push({n:3, key:'03', title:'Ciclo de vida', mod:'Módulo 1 · Fundamentos', time:5, el:false, cmds:['docker run -d','docker logs','docker stop','docker start','docker rm'],
  slides:[
    {h:'Ciclo de vida', body: cover({n:3,time:5,el:false,mod:'Módulo 1 · Fundamentos',cmds:['docker run -d --name','docker logs -f','docker stop','docker start','docker rm','docker rm -f']},
      'Executar um container em <strong>segundo plano</strong>, mantendo o terminal livre. Consultar os <strong>logs</strong>, que são as mensagens do programa, e praticar como parar, iniciar e remover containers.',
      qualquer)},
    {h:'O ciclo', eyebrow:'Conceito', body:`
      <div class="stack">
        <div class="flow">
          <div class="node"><b>docker run -d</b><small>cria e inicia</small></div>
          <div class="arr"><span class="a">→</span></div>
          <div class="node hi"><b>rodando</b><small>Up · docker ps · docker logs</small></div>
          <div class="arr"><span class="a">→</span><strong>docker stop</strong></div>
          <div class="node"><b>parado</b><small>Exited · só em docker ps -a</small></div>
          <div class="arr"><span class="a">→</span><strong>docker rm</strong></div>
          <div class="node dim"><b>não existe mais</b><small>logs e camada gravável somem</small></div>
        </div>
        <div class="cols">
          <div class="box lift"><h3>Iniciar novamente: start</h3><p><code>docker start</code> inicia o <strong>mesmo</strong> container, com os arquivos e logs anteriores. Já <code>docker run</code> cria um novo container.</p></div>
          <div class="box"><h3>Parar: stop</h3><p>Envia ao programa um pedido de encerramento, chamado <code>SIGTERM</code>. Neste ambiente, a espera padrão é de até 10 segundos. Se o programa não encerrar, o Docker força a parada com <code>SIGKILL</code>.</p></div>
          <div class="box"><h3>Remover: rm</h3><p><code>docker rm</code> remove um container parado. Se ele estiver rodando, aparece um erro. A opção <code>-f</code> força o encerramento e a remoção, sem a espera de <code>stop</code>.</p></div>
        </div>
        <div class="callout"><strong>-d: execução em segundo plano.</strong> O comando mostra o ID, uma sequência que identifica o container, e libera o terminal. Use <code>docker logs</code> para ler as mensagens ou <code>docker logs -f</code> para acompanhá-las. <kbd>Ctrl+C</kbd> encerra esse acompanhamento, mas mantém o container rodando.</div>
      </div>`},
    {h:'O desafio', eyebrow:'Tarefa · 5 min', body:`
      <div class="cols s2"><div class="stack">${steps([
        `<div class="t">Crie um relógio que mostra a hora a cada segundo. O trecho entre aspas repete <code>date</code> (data e hora) e <code>sleep 1</code> (espera de um segundo). Você pode copiá-lo como está:</div>${cmd("$ docker run -d --name relogio alpine sh -c 'while true; do date; sleep 1; done'")}`,
        `<div class="t">Rodando (<code>Up … seconds</code>) e escrevendo nos logs:</div>${cmd('$ docker ps\n$ docker logs relogio\n$ docker logs -f relogio      # Ctrl+C sai do logs, não do container')}`,
        `<div class="t">Pare o relógio e compare as duas listas. Neste exemplo, a parada pode demorar cerca de 10 segundos; aguarde o terminal ficar disponível:</div>${cmd('$ docker stop relogio\n$ docker ps                   # só os containers em execução\n$ docker ps -a                # inclui o relogio parado: Exited')}`,
        `<div class="t">Inicie de novo. Os logs antigos continuam, e novos vão aparecendo:</div>${cmd('$ docker start relogio\n$ docker logs --tail 3 relogio')}`,
        `<div class="t">Crie outro container e tente removê-lo. O erro da segunda linha é esperado. Na terceira, <code>&amp;&amp;</code> executa a remoção apenas se a parada funcionar:</div>${cmd('$ docker run -d --name descartavel alpine sleep 600\n$ docker rm descartavel                 # erro: está rodando\n$ docker stop descartavel && docker rm descartavel')}`,
      ])}</div><div class="stack">
        <div class="box"><h3>Verificação</h3>${cmd('$ check.sh 03')}<p style="margin-top:10px;color:var(--muted)">Aprova com o <code>relogio</code> rodando (e já parado e iniciado ao menos uma vez) e o <code>descartavel</code> removido.</p></div>
        <div class="callout"><strong>Nome ou ID:</strong> os comandos que recebem um container aceitam seu nome ou um início de ID que o identifique sem ambiguidade. Aqui, use <code>relogio</code> e <code>descartavel</code>.</div>
        <div class="box soft"><h3>Missão extra</h3>${cmd('$ docker top relogio\n$ docker stats --no-stream relogio\n$ docker inspect relogio      # procure "State"')}<p style="margin-top:8px;color:var(--muted)">Consulte os programas em execução, o uso de processador e memória e os detalhes do container. <code>inspect</code> usa JSON, um formato de texto com nomes e valores.</p></div>
      </div></div>`},
    {h:'Comandos e documentação', eyebrow:'Referência', body:`
      <div class="cols s2">
        ${kv([
          ['docker run -d --name <n> <imagem> <cmd>','em segundo plano, com nome'],
          ['docker logs <n>','a saída do processo; -f segue ao vivo; --tail N as últimas linhas'],
          ['docker stop <n>','pede o encerramento e aguarda; neste ambiente, o prazo padrão é de 10 s'],
          ['docker start <n>','inicia novamente o mesmo container'],
          ['docker rm <n>','remove um container parado; -f remove mesmo rodando'],
          ['docker top <n>','lista os processos, isto é, os programas em execução no container'],
          ['docker stats --no-stream <n>','mostra o uso de processador e memória naquele momento'],
          ['docker inspect <n>','mostra detalhes do container em JSON'],
        ])}
        <div class="box soft"><h3>Documentação</h3>${docs([L.run_guide, L.r_logs, L.r_stop, L.r_start, L.r_rm, L.r_ps, L.h_alpine])}</div>
      </div>`},
  ]});

D.push({n:4, key:'04', title:'Meu primeiro Dockerfile', mod:'Módulo 2 · Dockerfile', time:6, el:false, cmds:['FROM','COPY','CMD','docker build -t'],
  slides:[
    {h:'Meu primeiro Dockerfile', body: cover({n:4,time:6,el:false,mod:'Módulo 2 · Dockerfile',cmds:['Dockerfile','FROM','COPY','CMD','docker build -t receitas:1.0 .','docker run --rm receitas:1.0']},
      'Criar uma <strong>imagem</strong> com o programa de receitas fornecido pelo curso. Você vai escrever o arquivo de instruções, chamado <code>Dockerfile</code>, construir a imagem e executar um container com ela.',
      cmd('$ cd ~/labs/04-meu-primeiro-dockerfile') + '<p style="margin-top:10px;color:var(--muted)">Execute este comando para entrar na pasta do desafio. O programa <code>receitas.py</code> já está pronto e mostra as receitas no terminal. Leia seu conteúdo com <code>cat receitas.py</code>.</p>')},
    {h:'Dockerfile → imagem → container', eyebrow:'Conceito', body:`
      <div class="stack">
        <div class="flow">
          <div class="node"><b>Dockerfile + pasta do projeto</b><small>instruções e arquivos usados para construir a imagem</small></div>
          <div class="arr"><span class="a">→</span><strong>docker build -t receitas:1.0 .</strong></div>
          <div class="node hi"><b>imagem receitas:1.0</b><small>resultado da construção · aparece em docker images</small></div>
          <div class="arr"><span class="a">→</span><strong>docker run --rm receitas:1.0</strong></div>
          <div class="node"><b>container</b><small>executa o programa, mostra as receitas e é removido por --rm</small></div>
        </div>
        <div class="cols s2">
          <div class="stack">
            ${cmd(`FROM python:3.12-slim

COPY receitas.py /app/receitas.py

CMD ["python", "/app/receitas.py"]`)}
            ${kv([
              ['FROM imagem','começa a partir de uma imagem existente (aqui, a que já tem Python)'],
              ['COPY origem destino','copia arquivos da pasta do projeto para a imagem'],
              ['CMD ["prog","arg"]','define o programa e seus argumentos; aqui, o Python e o caminho do arquivo receitas.py'],
            ], ['Instrução','O que faz'])}
          </div>
          <div class="stack">
            ${layers([
              {t:'CMD ["python", "/app/receitas.py"]', s:'configuração do comando; não executa o programa no build', cls:'dim'},
              {t:'COPY receitas.py /app/receitas.py', s:'uma camada nova com o seu arquivo', cls:'hi'},
              {t:'FROM python:3.12-slim', s:'todas as camadas da imagem-base'},
            ], 'a imagem receitas:1.0, de cima para baixo')}
            <div class="callout"><strong>Build</strong> significa construção da imagem. O ponto <code>.</code> em <code>docker build</code> indica a pasta atual: ela é o <strong>contexto de construção</strong>. O <code>COPY</code> usa os arquivos dessa pasta. No desafio 7, vamos escolher quais deles ficam de fora.</div>
          </div>
        </div>
      </div>`},
    {h:'O desafio', eyebrow:'Tarefa · 6 min', body:`
      <div class="cols s2"><div class="stack">${steps([
        `<div class="t">Execute <code>code Dockerfile</code>. No editor, copie as três instruções do slide anterior e salve. Use D maiúsculo e não acrescente <code>.txt</code> ao nome do arquivo.</div>`,
        `<div class="t">Volte ao terminal e construa a imagem. <code>-t</code> define o nome <code>receitas</code> e a tag <code>1.0</code>; o ponto indica a pasta atual:</div>${cmd('$ docker build -t receitas:1.0 .')}`,
        `<div class="t">Confira se a imagem aparece na lista:</div>${cmd('$ docker images receitas')}`,
        `<div class="t">Execute um container. O comando Python já está definido em <code>CMD</code>, por isso você só precisa informar a imagem:</div>${cmd('$ docker run --rm receitas:1.0')}`,
      ])}</div><div class="stack">
        <div class="box"><h3>Verificação</h3>${cmd('$ check.sh 04')}<p style="margin-top:10px;color:var(--muted)">Roda a sua imagem e confere que o livro de receitas aparece.</p></div>
        <div class="callout"><strong>Se precisar corrigir:</strong> salve o Dockerfile e repita o <code>docker build</code>. A tag passará a apontar para a imagem atualizada. Para executar outro comando no lugar de <code>CMD</code>, use, por exemplo, <code>docker run --rm receitas:1.0 python --version</code>.</div>
        <div class="box soft"><h3>Missão extra · tags</h3>${cmd('$ docker tag receitas:1.0 receitas:latest\n$ docker images receitas      # mesmo IMAGE ID, dois nomes\n$ docker run --rm receitas    # sem tag = latest')}</div>
      </div></div>`},
    {h:'Comandos e documentação', eyebrow:'Referência', body:`
      <div class="cols s2">
        ${kv([
          ['docker build -t nome:tag .','constrói a imagem a partir do Dockerfile da pasta atual'],
          ['docker images [nome]','lista as imagens (filtrando pelo nome)'],
          ['docker tag origem destino','dá outro nome à mesma imagem'],
          ['docker run --rm nome:tag','roda o CMD da imagem e remove o container ao terminar'],
          ['docker image rm nome:tag','remove a imagem (ou só a tag, se houver outras)'],
        ])}
        <div class="box soft"><h3>Documentação</h3>${docs([L.c_df, L.df_from, L.df_copy, L.df_cmd, L.r_build, L.r_tag, L.r_images])}</div>
      </div>`},
  ]});

D.push({n:5, key:'05', title:'Instalando dependências', mod:'Módulo 2 · Dockerfile', time:6, el:false, cmds:['WORKDIR','RUN pip install','requirements.txt'],
  slides:[
    {h:'Instalando dependências', body: cover({n:5,time:6,el:false,mod:'Módulo 2 · Dockerfile',cmds:['WORKDIR /app','COPY . .','RUN pip install -r requirements.txt','docker build -t receitas-api:1.0 .']},
      'Instalar na imagem os pacotes de software de que o programa precisa: suas <strong>dependências</strong>. Agora, o livro de receitas é uma <strong>API</strong>, um programa que recebe pedidos pela rede e responde com dados.',
      cmd('$ cd ~/labs/05-instalando-dependencias') + '<p style="margin-top:10px;color:var(--muted)"><code>app.py</code> é o programa, já pronto. Ele usa FastAPI e uvicorn, listados em <code>requirements.txt</code>. Vamos instalar esses pacotes na imagem.</p>')},
    {h:'Construir a imagem e executar o programa', eyebrow:'Conceito · RUN e CMD', body:`
      <div class="cols s2"><div class="stack">
        <div class="flow">
          <div class="node hi"><b>build: construção</b><small><strong>RUN</strong> instala as dependências · o resultado fica na imagem</small></div>
          <div class="arr"><span class="a">→</span>imagem pronta</div>
          <div class="node"><b>run: execução</b><small><strong>CMD</strong> define o comando padrão ao iniciar o container</small></div>
        </div>
        ${cmd(`FROM python:3.12-slim

WORKDIR /app

COPY . .
RUN pip install --no-cache-dir -r requirements.txt

CMD ["python", "app.py"]`)}
        ${kv([
          ['WORKDIR /app','define a pasta de trabalho na imagem e a cria, se necessário'],
          ['RUN comando','executa durante a construção; aqui, instala os pacotes do Python'],
          ['COPY . .','copia da pasta do projeto (primeiro ponto) para a pasta de trabalho /app (segundo ponto)'],
        ], ['Instrução','O que faz'])}
      </div><div class="stack">
        <div class="box lift"><h3>O app.py, em resumo</h3>${cmd(`import uvicorn
from fastapi import FastAPI
app = FastAPI(title="Livro de receitas")

@app.get("/receitas")
def receitas():
    return RECEITAS

if __name__ == "__main__":
    uvicorn.run(app, host="0.0.0.0", port=8000)`)}<p style="margin-top:10px">Este trecho é apenas para consulta. O FastAPI define as <strong>rotas</strong>, caminhos como <code>/receitas</code>. O uvicorn recebe os pedidos e envia as respostas. A porta <code>8000</code> identifica onde ele recebe conexões; veremos o acesso no desafio 8.</p></div>
        <div class="callout"><strong>Como ler pip install:</strong> <code>pip</code> instala pacotes Python; <code>-r requirements.txt</code> indica a lista de pacotes; <code>--no-cache-dir</code> evita guardar os arquivos de download na imagem. Se a instalação falhar, a construção para e mostra o erro.</div>

D.push({n:6, key:'06', title:'Camadas e cache', mod:'Módulo 2 · Dockerfile', time:5, el:false, cmds:['ordem das instruções','docker history','CACHED'],
  slides:[
    {h:'Camadas e cache', body: cover({n:6,time:5,el:false,mod:'Módulo 2 · Dockerfile',cmds:['COPY requirements.txt .','RUN pip install','COPY . .','docker history']},
      'Organizar o Dockerfile para <strong>reaproveitar a instalação das dependências</strong> quando você alterar apenas o código. Esse reaproveitamento de resultados anteriores é chamado de <strong>cache</strong>.',
      cmd('$ cd ~/labs/06-camadas-e-cache') + '<p style="margin-top:10px;color:var(--muted)"><code>app.py</code>, <code>requirements.txt</code> e um <code>Dockerfile</code> igual ao do desafio 5: <code>COPY . .</code> <strong>antes</strong> do <code>pip install</code>.</p>')},
    {h:'O que precisa ser construído de novo?', eyebrow:'Conceito · camadas e cache', body:`
      <div class="stack">
        <div class="cols w2">
          ${layers([
            {t:'CMD ["python", "app.py"]', s:'', cls:'dim'},
            {t:'RUN pip install …', s:'instala as dependências novamente', tag:'REFAZ', tagCls:'redo'},
            {t:'COPY . .', s:'app.py mudou → camada nova', tag:'REFAZ', tagCls:'redo', cls:'hi'},
            {t:'WORKDIR /app', tag:'CACHED', tagCls:'ok'},
            {t:'FROM python:3.12-slim', tag:'CACHED', tagCls:'ok'},
          ], 'código copiado antes: alterar app.py também refaz a instalação')}
          ${layers([
            {t:'CMD ["python", "app.py"]', s:'', cls:'dim'},
            {t:'COPY . .', s:'app.py mudou → camada nova', tag:'REFAZ', tagCls:'redo', cls:'hi'},
            {t:'RUN pip install …', s:'as etapas anteriores não mudaram', tag:'CACHED', tagCls:'ok'},
            {t:'COPY requirements.txt .', s:'mesmo arquivo', tag:'CACHED', tagCls:'ok'},
            {t:'WORKDIR /app', tag:'CACHED', tagCls:'ok'},
            {t:'FROM python:3.12-slim', tag:'CACHED', tagCls:'ok'},
          ], 'código copiado depois: a instalação pode ser reutilizada')}
        </div>
        <div class="cols">
          <div class="box lift"><h3>O que significa CACHED?</h3><p>A imagem guarda alterações em arquivos como <strong>camadas</strong>. Se a instrução, sua base e os arquivos usados continuam iguais, o Docker pode reutilizar o resultado: <code>CACHED</code>. Ao mudar uma etapa, as seguintes que dependem dela precisam ser refeitas.</p></div>
          <div class="box"><h3>Como organizar o Dockerfile</h3><p>Copie primeiro <code>requirements.txt</code> e instale as dependências. Depois, copie o código. Assim, editar uma receita em <code>app.py</code> não obriga o Docker a repetir a instalação.</p><p>Nem toda instrução acrescenta arquivos: <code>CMD</code>, por exemplo, guarda uma configuração.</p></div>
        </div>
      </div>`},
    {h:'O desafio', eyebrow:'Tarefa · 5 min', body:`
      <div class="cols s2"><div class="stack">${steps([
        `<div class="t">Construa uma vez:</div>${cmd('$ docker build -t receitas-api:1.1 .')}`,
        `<div class="t">Abra <code>app.py</code> com <code>code app.py</code>. Na lista <code>RECEITAS = [</code>, acrescente a linha abaixo antes do <code>]</code> final, alinhada às outras receitas:</div>${cmd('{"nome": "Mousse de maracujá", "rende": "6 porções"},')}<p>Salve e repita a construção no terminal; o pip será executado novamente:</p>${cmd('$ docker build -t receitas-api:1.1 .')}`,
        `<div class="t">No Dockerfile, substitua as linhas <code>COPY . .</code> e <code>RUN pip install…</code> pelo trecho abaixo. Mantenha <code>FROM</code>, <code>WORKDIR</code> e <code>CMD</code> como estão:</div>${cmd(`COPY requirements.txt .
RUN pip install --no-cache-dir -r requirements.txt

COPY . .`)}`,
        `<div class="t">Salve o Dockerfile e construa a imagem. Depois, troque <code>Mousse de maracujá</code> por <code>Mousse de limão</code> em <code>app.py</code>, salve e construa de novo. A etapa do pip deve aparecer como <code>CACHED</code>:</div>${cmd('$ docker build -t receitas-api:1.1 .\n# edite e salve app.py antes de continuar\n$ docker build -t receitas-api:1.1 .')}`,
        `<div class="t">Consulte o histórico da imagem, com as instruções e o tamanho de cada etapa:</div>${cmd('$ docker history receitas-api:1.1')}`,
      ])}</div><div class="stack">
        <div class="box"><h3>Verificação</h3>${cmd('$ check.sh 06')}<p style="margin-top:10px;color:var(--muted)">Aprova com o Dockerfile na ordem certa, o <code>app.py</code> alterado e a imagem contendo a versão atual dele.</p></div>
        <div class="callout"><strong>O que observar:</strong> procure <code>CACHED</code> na etapa <code>RUN pip install</code>. O instalador já preparou parte do cache, então essa indicação também pode aparecer na primeira construção com a nova ordem.</div>
        <div class="box soft"><h3>Missão extra</h3>${cmd('$ time docker build --no-cache -t receitas-api:1.1 .\n$ time docker build -t receitas-api:1.1 .')}<p style="margin-top:8px;color:var(--muted)"><code>time</code> mede a duração. Compare o valor de <code>real</code> na construção sem cache e na seguinte.</p></div>
      </div></div>`},
    {h:'Comandos e documentação', eyebrow:'Referência', body:`
      <div class="cols s2">
        ${kv([
          ['docker history <imagem>','as camadas, com instrução e tamanho'],
          ['docker build --no-cache …','ignora o cache e refaz tudo'],
          ['docker build --progress=plain …','saída completa, sem redesenhar a tela'],
          ['COPY requirements.txt .','copie primeiro o que muda menos'],
          ['docker system df','quanto disco o cache de build ocupa (desafio 15)'],
        ])}
        <div class="box soft"><h3>Documentação</h3>${docs([L.c_layers, L.c_cache, L.cache, L.best, L.r_hist])}</div>
      </div>`},
  ]});

D.push({n:7, key:'07', title:'O que não entra na imagem', mod:'Módulo 2 · Dockerfile', time:4, el:true, cmds:['.dockerignore','contexto de build'],

      'Escolher quais arquivos do projeto devem ficar <strong>fora da imagem</strong>. Você vai criar um <code>.dockerignore</code>, um arquivo de texto com a lista do que o Docker deve ignorar.',

        <div class="cols">

            <div class="callout"><strong>Um nome por linha.</strong> Crie o arquivo na mesma pasta do Dockerfile. Você pode listar arquivos e pastas. O filtro vale para todo o contexto de construção.</div>

__pycache__

D.push({n:8, key:'08', title:'Abrindo portas', mod:'Módulo 3 · Portas e configuração', time:5, el:false, cmds:['-p 8001:8000','EXPOSE','aba PORTS'],
  slides:[
    {h:'Abrindo portas', body: cover({n:8,time:5,el:false,mod:'Módulo 3 · Portas e configuração',cmds:['EXPOSE 8000','docker run -d -p 8001:8000','curl localhost:8001/receitas','docker port','aba PORTS','/docs']},
      'Acessar, do navegador, uma API que roda <strong>dentro</strong> de um container: publicar a porta com <code>-p</code> e documentá-la com <code>EXPOSE</code>.',
      cmd('$ cd ~/labs/08-abrindo-portas') + '<p style="margin-top:10px;color:var(--muted)">A API (<code>app.py</code>, <code>requirements.txt</code>, <code>.dockerignore</code>) e um <code>Dockerfile</code> pronto, na ordem certa, mas sem <code>EXPOSE</code>.</p>')},
    {h:'Como acessar a porta do container?', eyebrow:'Conceito · -p fora:dentro', body:`
      <div class="stack">
        ${ports(8001, 8000, {app:'uvicorn'})}
        <div class="cols">
          <div class="box lift"><h3>Publicar uma porta com -p</h3><p>Uma <strong>porta</strong> é um número que direciona conexões a um programa. <code>-p 8001:8000</code> encaminha os pedidos recebidos na porta 8001 do Codespace à porta 8000 do container.</p><p>A ordem é <strong><code>fora:dentro</code></strong>: primeiro o Codespace, depois o container.</p></div>
          <div class="box"><h3>Registrar a porta com EXPOSE</h3><p><code>EXPOSE 8000</code> informa, no Dockerfile, qual porta o programa usa. Essa instrução sozinha não publica a porta no Codespace; fazemos isso com <code>-p</code> ao criar o container.</p></div>
          <div class="box"><h3>A configuração do servidor</h3><p><code>127.0.0.1</code> aceita conexões apenas do próprio ambiente em que o programa roda. No container, isso impediria o acesso de fora. O código fornecido usa <code>0.0.0.0</code> para aceitar essas conexões.</p></div>
        </div>
        <div class="callout"><strong>Terminal e navegador usam endereços diferentes.</strong> No terminal do Codespace, <code>localhost</code> aponta para o Codespace. No navegador do seu computador, use o endereço fornecido pela aba <strong>PORTS</strong>: passe o mouse sobre a porta e clique no globo, <em>Open in Browser</em>. O acesso depende da configuração de visibilidade da porta.</div>
      </div>`},
    {h:'O desafio', eyebrow:'Tarefa · 5 min', body:`
      <div class="cols s2"><div class="stack">${steps([
        `<div class="t">Abra o <code>Dockerfile</code>, acrescente <code>EXPOSE 8000</code> antes de <code>CMD</code> e salve. No terminal, construa a imagem:</div>${cmd('$ docker build -t receitas-api:1.3 .')}`,
        `<div class="t">Rode em segundo plano, publicando a porta:</div>${cmd('$ docker run -d --name api -p 8001:8000 receitas-api:1.3')}`,
        `<div class="t">Teste com <code>curl</code>, que acessa o endereço e mostra a resposta no terminal. Depois, consulte a ligação entre as portas:</div>${cmd('$ curl localhost:8001/receitas\n$ docker port api')}`,
        `<div class="t">Na aba <strong>PORTS</strong>, abra a porta <strong>8001</strong> pelo ícone de globo. Acrescente <code>/docs</code> ao endereço. Nessa página, expanda <strong>GET /receitas</strong>, clique em <strong>Try it out</strong> e depois em <strong>Execute</strong> para testar a API.</div>`,
        `<div class="t">Cada pedido à API, chamado de <strong>requisição</strong>, aparece nos logs:</div>${cmd('$ docker logs api')}`,
      ])}</div><div class="stack">
        <div class="box"><h3>Verificação</h3>${cmd('$ check.sh 08')}<p style="margin-top:10px;color:var(--muted)">Confere o <code>EXPOSE</code>, o container <code>api</code> na 8001 e a resposta de <code>/receitas</code>.</p></div>
        <div class="callout warn"><strong>Se a conexão falhar logo no início:</strong> espere alguns segundos e tente novamente. Já <em>port is already allocated</em> significa que a porta está ocupada. Consulte <code>docker ps</code> para identificar o container que a usa; a verificação deste desafio espera a porta 8001.</div>
        <div class="box soft"><h3>Missão extra</h3>${cmd('$ docker run -d --name api2 -p 8005:8000 receitas-api:1.3\n$ curl localhost:8005/receitas\n$ docker rm -f api2')}<p style="margin-top:8px;color:var(--muted)">Duas cópias da mesma imagem, lado a lado, em portas diferentes.</p></div>
      </div></div>`},
    {h:'Comandos e documentação', eyebrow:'Referência', body:`
      <div class="cols s2">
        ${kv([
          ['docker run -p <fora>:<dentro> …','publica a porta; pode repetir -p para várias'],
          ['EXPOSE 8000','documenta a porta no Dockerfile (sem abrir)'],
          ['docker port <nome>','mostra quais portas do Codespace estão ligadas às do container'],
          ['curl localhost:<fora>/…','acessa a aplicação pelo terminal do Codespace'],
          ['docker ps','a coluna PORTS mostra 0.0.0.0:8001->8000/tcp'],
          ['/docs','página gerada pelo FastAPI para consultar e testar as rotas deste projeto'],
        ])}
        <div class="box soft"><h3>Documentação</h3>${docs([L.c_ports, L.df_expose, L.r_port, L.gh_ports, L.r_run])}</div>
      </div>`},
  ]});

D.push({n:9, key:'09', title:'Configuração por ambiente', mod:'Módulo 3 · Portas e configuração', time:5, el:false, cmds:['ENV','-e','--env-file','docker exec'],
  slides:[
    {h:'Configuração por ambiente', body: cover({n:9,time:5,el:false,mod:'Módulo 3 · Portas e configuração',cmds:['ENV COZINHA="…"','docker run -e COZINHA="…"','--env-file cozinha.env','docker exec <nome> env']},
      'Mudar o nome da cozinha exibido pela API <strong>sem reconstruir a imagem</strong>. Vamos usar uma <strong>variável de ambiente</strong>: uma configuração com nome e valor que o programa lê ao iniciar.',
      cmd('$ cd ~/labs/09-configuracao-por-ambiente') + '<p style="margin-top:10px;color:var(--muted)">O programa já lê a variável <code>COZINHA</code> e usa seu valor na mensagem da rota <code>/</code>. O Dockerfile ainda não define esse valor. O arquivo <code>cozinha.env</code> será usado na missão extra.</p>')},
    {h:'Qual valor o programa usa?', eyebrow:'Conceito · variável COZINHA', body:`
      <div class="stack">
        <div class="flow">
          <div class="node dim"><b>Valor de reserva no código</b><small>"Cozinha sem nome" · usado se a variável não estiver definida</small></div>
          <div class="arr"><span class="a">→</span>substituído por</div>
          <div class="node"><b>Padrão da imagem</b><small>ENV COZINHA="Cozinha do Curso"</small></div>
          <div class="arr"><span class="a">→</span>substituído por</div>
          <div class="node hi"><b>Valor deste container</b><small>-e COZINHA="Cozinha da Ana" · ou um arquivo com --env-file</small></div>
        </div>
        <div class="cols s2">
          <div class="box lift"><h3>Como o programa lê a configuração</h3><p>Neste trecho, já pronto em <code>app.py</code>, o programa procura a variável <code>COZINHA</code>. Se ela não existir, usa <code>Cozinha sem nome</code>.</p>${cmd(`import os
COZINHA = os.environ.get("COZINHA", "Cozinha sem nome")`)}<p style="margin-top:10px">Definir outro valor ao criar o container permite mudar a configuração usando a mesma imagem.</p></div>
          <div class="stack">
            <div class="callout warn"><strong>Segredos não vão em ENV no Dockerfile.</strong> Ficam gravados na imagem, como o <code>.env</code> do desafio 7. Senhas entram por <code>-e</code> ou <code>--env-file</code>, na hora de rodar.</div>
            <div class="callout"><strong>docker exec</strong> executa um comando em um container que já está rodando. <code>docker exec cozinha env</code> lista suas variáveis de ambiente, incluindo o valor de <code>COZINHA</code>.</div>
          </div>
        </div>
      </div>`},
    {h:'O desafio', eyebrow:'Tarefa · 5 min', body:`
      <div class="cols s2"><div class="stack">${steps([
        `<div class="t">No Dockerfile, acrescente <code>ENV COZINHA="Cozinha do Curso"</code> antes de <code>EXPOSE</code> e salve. Construa e consulte o valor padrão:</div>${cmd('$ docker build -t receitas-api:1.4 .\n$ docker run --rm receitas-api:1.4 env | grep COZINHA')}`,

D.push({n:10, key:'10', title:'Editando ao vivo', mod:'Módulo 4 · Dados', time:5, el:false, cmds:['bind mount','-v "$PWD:/app"'],

          <div class="arr"><span class="a">⇄</span><strong>-v "$PWD:/app"</strong><br>acesso aos mesmos arquivos</div>

        </div>
        <div class="cols s2">
          ${layers([

            <div class="callout"><strong>Durante o desenvolvimento:</strong> compartilhar o código ajuda a editar e testar. Para distribuir o programa atualizado, construa uma nova imagem. Um bind mount também pode fornecer arquivos de configuração ao container.</div>

        `<div class="t">Execute <code>code app.py</code>. Acrescente a linha abaixo à lista <code>RECEITAS</code>, antes do <code>]</code> final, com o mesmo alinhamento das outras receitas:</div>${cmd('{"nome": "Pudim", "rende": "8 porções"},')}<p>Salve e consulte os logs. Uma mensagem com <em>Reloading</em> indica que o programa está recarregando:</p>${cmd('$ docker logs dev')}`,

        <div class="box soft"><h3>Missão extra</h3>${cmd('$ docker exec dev sh -c \'echo "escrito de dentro" > /app/de-dentro.txt\'\n$ cat de-dentro.txt\n$ rm de-dentro.txt')}<p style="margin-top:8px;color:var(--muted)">Escrito de dentro, aparece fora. É a mesma pasta.</p></div>
      </div></div>`},
    {h:'Comandos e documentação', eyebrow:'Referência', body:`
      <div class="cols s2">
        ${kv([
          ['docker run -v "$PWD:/app" …','monta a pasta atual em /app (bind mount)'],

D.push({n:11, key:'11', title:'Dados que ficam', mod:'Módulo 4 · Dados', time:5, el:true, cmds:['docker volume create','-v notas:/dados','ENTRYPOINT'],
  slides:[
    {h:'Dados que ficam', body: cover({n:11,time:5,el:true,mod:'Módulo 4 · Dados',cmds:['docker volume create notas','docker run -v notas:/dados','docker volume ls','docker volume inspect']},
      'Guardar notas em um <strong>volume</strong>, um espaço de armazenamento gerenciado pelo Docker. Assim, os dados permanecem mesmo depois de remover o container que os criou.',
      cmd('$ cd ~/labs/11-dados-que-ficam') + '<p style="margin-top:10px;color:var(--muted)"><code>bloco.py</code>: um bloco de notas que acrescenta cada nota a <code>/dados/notas.txt</code> e imprime todas. <code>Dockerfile</code> pronto, com <code>ENTRYPOINT</code> em vez de <code>CMD</code>.</p>')},
    {h:'Onde os dados ficam guardados?', eyebrow:'Conceito', body:`
      <div class="stack">
        <div class="cols s2">
          ${kv([
            ['camada gravável','arquivos próprios do container; são apagados quando ele é removido'],
            ['bind mount  -v /pasta/sua:/x','arquivos da pasta do Codespace, compartilhados com o container'],
            ['volume  -v nome:/x','arquivos em um espaço gerenciado pelo Docker, mantido até você removê-lo'],
          ], ['Local','O que acontece com os arquivos'])}
          <div class="flow">
            <div class="node dim"><b>container 1</b><small>grava uma nota e é removido por --rm</small></div>
            <div class="arr"><span class="a">→</span></div>
            <div class="node hi"><b>volume notas</b><small>/dados/notas.txt · fica</small></div>
            <div class="arr"><span class="a">←</span></div>
            <div class="node dim"><b>container 2</b><small>lê as notas, grava outra e é removido por --rm</small></div>
          </div>
        </div>
        <div class="cols">
          <div class="box lift"><h3>Volume</h3><p>Uma pasta que o Docker guarda e administra. Você não precisa saber onde ela fica no disco; só o nome. Independente da imagem: qualquer container pode montá-la.</p></div>
          <div class="box"><h3>O que é um argumento?</h3><p>É uma informação passada ao programa. Aqui, <code>ENTRYPOINT</code> define que o programa será <code>bloco.py</code>, e o texto depois da imagem, como <code>"comprar cenouras"</code>, é a nota a guardar.</p><p>Nos exemplos anteriores, com apenas <code>CMD</code>, um texto depois da imagem substituiria o comando inteiro.</p></div>
          <div class="box"><h3>Nome de volume ou caminho de pasta?</h3><p><code>-v notas:/dados</code> usa o volume chamado <code>notas</code>. <code>-v "$PWD:/dados"</code> compartilha a pasta atual. Nos dois casos, o programa acessa os arquivos pelo caminho <code>/dados</code> dentro do container.</p></div>
        </div>
      </div>`},
    {h:'O desafio', eyebrow:'Tarefa · 5 min · pode ficar para depois da aula', body:`
      <div class="cols s2"><div class="stack">${steps([
        `<div class="t">Construa a imagem e execute o bloco de notas duas vezes. A segunda execução mostra <strong>apenas</strong> "assar o bolo": a primeira nota estava no container removido por <code>--rm</code>.</div>${cmd('$ docker build -t bloco:1.0 .\n$ docker run --rm bloco:1.0 "comprar cenouras"\n$ docker run --rm bloco:1.0 "assar o bolo"')}`,
        `<div class="t">Crie um volume e ligue-o à pasta <code>/dados</code> do container. Agora as duas notas aparecem: containers diferentes, mesmo volume.</div>${cmd('$ docker volume create notas\n$ docker run --rm -v notas:/dados bloco:1.0 "comprar cenouras"\n$ docker run --rm -v notas:/dados bloco:1.0 "assar o bolo"')}`,
        `<div class="t">Execute sem passar uma nova nota para apenas ler as anteriores. Depois, liste os volumes e consulte os detalhes de <code>notas</code>:</div>${cmd('$ docker run --rm -v notas:/dados bloco:1.0\n$ docker volume ls\n$ docker volume inspect notas')}`,
      ])}</div><div class="stack">
        <div class="box"><h3>Verificação</h3>${cmd('$ check.sh 11')}<p style="margin-top:10px;color:var(--muted)">Lê o volume com outro container e espera pelo menos duas notas.</p></div>
        <div class="box soft"><h3>Missão extra</h3>${cmd('$ docker run --rm -v notas:/dados alpine cat /dados/notas.txt')}<p style="margin-top:8px;color:var(--muted)">Leia as notas com outra imagem. Depois, <code>docker volume rm notas</code> apaga o volume e seu conteúdo. Para recomeçar, use <code>reset.sh 11</code>, entre novamente na pasta e repita o exercício.</p></div>
        <div class="callout warn"><strong>Se faltar tempo:</strong> você pode fazer este desafio depois da aula e seguir para o bloco de vários containers.</div>
      </div></div>`},
    {h:'Comandos e documentação', eyebrow:'Referência', body:`
      <div class="cols s2">
        ${kv([
          ['docker volume create <nome>','cria um volume vazio (o -v também cria, se não existir)'],
          ['docker run -v <nome>:/pasta …','monta o volume na pasta do container'],
          ['docker volume ls','lista os volumes existentes'],
          ['docker volume inspect <nome>','mostra detalhes do volume, incluindo seu local no disco'],
          ['docker volume rm <nome>','apaga o volume e os dados; só se nenhum container o usa'],
          ['ENTRYPOINT ["prog"]','o programa fixo; argumentos vêm do docker run'],
        ])}
        <div class="box soft"><h3>Documentação</h3>${docs([L.c_persist, L.vols, L.r_vol, L.df_entry])}</div>
      </div>`},
  ]});

D.push({n:12, key:'12', title:'Site estático', mod:'Módulo 5 · Vários containers', time:5, el:false, cmds:['nginx:alpine','HTML/JS','COPY site/'],

      'Executar um site em um container usando o <strong>nginx</strong>, um servidor web que entrega os arquivos da página ao navegador. O site está pronto; você vai criar a imagem e publicar uma porta para acessá-lo.',

          <div class="arr"><span class="a">→</span>COPY site/ /usr/share/nginx/html/</div>

COPY site/ /usr/share/nginx/html/`)}`,
        `<div class="t">Construa e rode, ligando a 8080 do Codespace à 80 do container:</div>${cmd('$ docker build -t receitas-web:1.0 .\n$ docker run -d --name web -p 8080:80 receitas-web:1.0')}`,

    {h:'Comandos e documentação', eyebrow:'Referência', body:`
      <div class="cols s2">
        ${kv([

        <div class="box soft"><h3>Documentação</h3>${docs([L.h_nginx, L.c_reg, L.df_copy, L.r_logs, L.gh_ports])}</div>

D.push({n:13, key:'13', title:'Containers conversando', mod:'Módulo 5 · Vários containers', time:6, el:false, cmds:['docker network create','--network','DNS por nome'],
  slides:[
    {h:'Containers conversando', body: cover({n:13,time:6,el:false,mod:'Módulo 5 · Vários containers',cmds:['docker network create cozinha','docker run --network cozinha','http://receitas:8000','docker network inspect']},
      'Fazer um container chamar outro <strong>pelo nome</strong>, numa rede criada por você, sem publicar porta nenhuma para fora.',
      cmd('$ cd ~/labs/13-containers-conversando') + '<p style="margin-top:10px;color:var(--muted)">A API (Dockerfile completo) e um <code>cliente.py</code>, que busca <code>http://receitas:8000/receitas</code> e imprime o resultado. <code>receitas</code> é um <strong>nome</strong>, não um IP.</p>')},
    {h:'Como um container encontra o outro?', eyebrow:'Conceito · redes e DNS', body:`
      <div class="stack">
        <div class="netbox" data-label="rede cozinha"><div class="flow">
          <div class="node hi"><b>receitas</b><small>a API · escuta na 8000 · <strong>sem -p</strong></small></div>
          <div class="arr back"><span class="a">←</span>http://receitas:8000/receitas</div>
          <div class="node"><b>cliente</b><small>python:3.12-slim rodando cliente.py</small></div>
        </div></div>
        <div class="cols">
          <div class="box lift"><h3>O papel do DNS</h3><p>Um endereço <strong>IP</strong> identifica um participante da rede. O <strong>DNS</strong> encontra esse endereço a partir de um nome. Nas redes criadas por você, o Docker oferece esse serviço: o cliente pode usar <code>receitas</code> no endereço.</p><p>Na rede padrão <code>bridge</code>, essa busca automática por nome não está disponível.</p></div>
          <div class="box"><h3>Quando usar -p?</h3><p>Use <code>-p</code> para publicar uma porta no Codespace. Entre containers da mesma rede, isso não é necessário: o cliente acessa a porta 8000 de <code>receitas</code> diretamente.</p></div>
          <div class="box"><h3>O cliente.py</h3>${cmd(`URL = "http://receitas:8000/receitas"
with urllib.request.urlopen(URL, timeout=5) as resposta:
    receitas = json.load(resposta)`)}</div>
        </div>
      </div>`},
    {h:'O desafio', eyebrow:'Tarefa · 6 min', body:`
      <div class="cols s2"><div class="stack">${steps([
        `<div class="t">Construa a API e crie a rede:</div>${cmd('$ docker build -t receitas-api:1.6 .\n$ docker network create cozinha\n$ docker network ls')}`,
        `<div class="t">Inicie a API com o nome <code>receitas</code> na rede <code>cozinha</code>, sem <code>-p</code>. O teste com <code>localhost:8000</code> deve falhar: não publicamos essa porta no Codespace.</div>${cmd('$ docker run -d --name receitas --network cozinha receitas-api:1.6\n$ curl localhost:8000/receitas      # erro esperado: conexão recusada')}`,
        `<div class="t">Execute o cliente em outro container da mesma rede. <code>-v</code> compartilha a pasta com o arquivo <code>cliente.py</code>. A saída deve mostrar as receitas recebidas da API:</div>${cmd('$ docker run --rm --network cozinha -v "$PWD:/app" python:3.12-slim python /app/cliente.py')}`,
        `<div class="t">Consulte os containers conectados. O cliente já terminou e foi removido por <code>--rm</code>; a API continua na rede:</div>${cmd('$ docker network inspect cozinha')}`,
      ])}</div><div class="stack">
        <div class="box"><h3>Verificação</h3>${cmd('$ check.sh 13')}<p style="margin-top:10px;color:var(--muted)">Inicia um container temporário na rede <code>cozinha</code> e testa o endereço da API. Também identifica se ela está sem porta publicada.</p></div>
        <div class="callout"><strong>Use o nome esperado pelo cliente.</strong> O endereço em <code>cliente.py</code> usa <code>receitas</code>, então o container da API precisa desse nome. Sem <code>--name</code>, o Docker geraria outro nome automaticamente.</div>
        <div class="box soft"><h3>Missão extra</h3><p>Rode o cliente <strong>sem</strong> <code>--network cozinha</code> e leia o erro: fora da rede, o nome <code>receitas</code> não existe. Compare <code>docker network inspect bridge</code> com <code>docker network inspect cozinha</code>.</p></div>
      </div></div>`},
    {h:'Comandos e documentação', eyebrow:'Referência', body:`
      <div class="cols s2">
        ${kv([
          ['docker network create <nome>','uma rede com DNS por nome de container'],
          ['docker run --network <rede> --name <n> …','entra na rede com esse nome'],
          ['docker network ls','lista as redes existentes'],
          ['docker network inspect <rede>','mostra os containers conectados e seus endereços IP'],
          ['docker network connect <rede> <container>','um container pode estar em várias redes'],
          ['docker network rm <rede>','apaga (só sem containers conectados)'],
        ])}
        <div class="box soft"><h3>Documentação</h3>${docs([L.net, L.bridge, L.r_net, L.c_multi, L.r_run])}</div>
      </div>`},
  ]});

</script>
<script>
/* ---------- app: home + router ---------- */
const ALL = [INTRO, ...D];
const byKey = k => ALL.find(d => String(d.key) === String(k));
const pad = n => typeof n === 'number' ? String(n).padStart(2,'0') : n;

function renderHome(){
  const total = D.reduce((a,d)=>a+d.time,0);
  const tiles = ALL.map(d => {
    const isIntro = d.key === 'intro';
    return `<a class="tile ${d.el?'el':''}" href="#/d/${d.key}/1" ${d.el?'title="Este desafio pode ficar para depois da aula, se faltar tempo"':''}>
      <div class="row"><div class="num">${isIntro?'∅':pad(d.n)}</div><div class="mod">${d.mod}</div></div>
      <div><h3>${isIntro? d.short : d.title}</h3><div class="cmds" style="margin-top:8px">${d.cmds.map(esc).join(' · ')}</div></div>
      <div class="foot"><span>${d.slides.length} slides</span><span>⏱ ${d.time} min</span></div>
    </a>`;
  }).join('');
  document.getElementById('home').innerHTML = `
    <header class="hero">
      <div><h1>Docker<span>no Codespaces</span></h1>
        <p class="sub">Aprenda Docker em uma aula ao vivo de 3 horas, com exercícios no navegador. Não é preciso saber programar. Abra a introdução para conhecer o ambiente e, depois, siga os desafios na ordem.</p></div>
      <div class="meta"><div><b>16</b>desafios</div><div><b>${total}</b>min de prática</div><div><b>3h</b>de aula</div></div>
    </header>
    <div class="legend"><span><span class="sw"></span>desafio</span><span><span class="sw el"></span>pode ficar para depois da aula, se faltar tempo</span><span>teclado: <kbd>→</kbd> <kbd>←</kbd> mudar de slide · <kbd>Esc</kbd> voltar ao início · <kbd>F</kbd> tela cheia</span></div>
    <div class="grid">${tiles}</div>
    <footer class="homefoot">
      <span>Prepare o ambiente e faça o desafio 0 antes da aula. Na aula, siga do 1 ao 15, com intervalo depois do 7.</span>
      <span>Enunciados, gabarito e guia do professor: <a href="https://github.com/fsilva-alt/devops-docker" target="_blank" rel="noopener">github.com/fsilva-alt/devops-docker</a></span>
      <span>Leitura sugerida: <a href="https://livro.descomplicandodocker.com.br/" target="_blank" rel="noopener">Descomplicando Docker (livro gratuito, pt-br)</a></span>
    </footer>`;
}

let cur = null; // {d, i}
function renderSlide(d, i){
  const s = d.slides[i];
  const n = d.slides.length;
  const isIntro = d.key === 'intro';
  document.getElementById('crumb').innerHTML = `${isIntro?'<b>Introdução</b>':`Desafio <b>${pad(d.n)}</b> · <b>${esc(d.title)}</b>`}<span style="opacity:.6"> · ${esc(s.h)}</span>`;
  document.getElementById('counter').textContent = `${i+1} / ${n}`;
  document.getElementById('dots').innerHTML = d.slides.map((_,k)=>`<i class="${k===i?'on':''}"></i>`).join('');
  const el = document.getElementById('slide');
  el.innerHTML = `<div class="eyebrow">${esc(s.eyebrow || (isIntro? 'Introdução' : `Desafio ${pad(d.n)} · ${d.mod}`))}</div><h2>${s.h}</h2>${s.body}`;
  el.style.animation = 'none'; void el.offsetWidth; el.style.animation = '';
  const prev = document.getElementById('btnPrev'), next = document.getElementById('btnNext');
  prev.toggleAttribute('disabled', i === 0);
  const idx = ALL.indexOf(d), last = i === n-1;
  if (last && idx < ALL.length-1){ const nd = ALL[idx+1]; next.innerHTML = `${nd.key==='intro'?'Introdução':'Desafio '+pad(nd.n)} →`; next.dataset.goto = `#/d/${nd.key}/1`; }
  else if (last){ next.innerHTML = 'Desafios ↑'; next.dataset.goto = '#/'; }
  else { next.innerHTML = 'Próximo →'; delete next.dataset.goto; }
  window.scrollTo({top:0});
}

function route(){
  const h = location.hash || '#/';
  const m = h.match(/^#\/d\/([^/]+)(?:\/(\d+))?/);
  const home = document.getElementById('home'), deck = document.getElementById('deck');
  if (m && byKey(m[1])){
    const d = byKey(m[1]);
    let i = Math.min(Math.max((parseInt(m[2]||'1',10)||1)-1, 0), d.slides.length-1);
    cur = {d, i};
    home.classList.add('hidden'); deck.classList.remove('hidden');
    renderSlide(d, i);
    document.title = `${d.key==='intro'?'Introdução':'Desafio '+pad(d.n)} · ${d.title} — Docker no Codespaces`;
  } else {
    cur = null;
    deck.classList.add('hidden'); home.classList.remove('hidden');
    document.title = 'Docker no Codespaces';
    if (h !== '#/') history.replaceState(null,'','#/');
  }
}
function go(delta){
  if (!cur) return;
  const {d, i} = cur;
  const ni = i + delta;
  if (ni < 0){ return; }
  if (ni >= d.slides.length){
    const next = document.getElementById('btnNext');
    if (next.dataset.goto) location.hash = next.dataset.goto;
    return;
  }
  location.hash = `#/d/${d.key}/${ni+1}`;
}

document.getElementById('btnPrev').addEventListener('click', ()=>go(-1));
document.getElementById('btnNext').addEventListener('click', ()=>go(1));
document.addEventListener('keydown', e => {
  if (e.target && /^(INPUT|TEXTAREA)$/.test(e.target.tagName)) return;
  if (e.altKey || e.ctrlKey || e.metaKey) return;
  switch (e.key){
    case 'ArrowRight': case 'ArrowDown': case 'PageDown': case ' ': if (cur){ e.preventDefault(); go(1);} break;
    case 'ArrowLeft': case 'ArrowUp': case 'PageUp': case 'Backspace': if (cur){ e.preventDefault(); go(-1);} break;
    case 'Escape': case 'h': case 'H': location.hash = '#/'; break;
    case 'f': case 'F': (document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.()); break;
    case 'Home': if (cur){ location.hash = `#/d/${cur.d.key}/1`; } break;
    case 'End': if (cur){ location.hash = `#/d/${cur.d.key}/${cur.d.slides.length}`; } break;
  }
});
// swipe
let tx = null;
document.addEventListener('touchstart', e => { tx = e.touches[0].clientX; }, {passive:true});
document.addEventListener('touchend', e => {
  if (tx === null || !cur) return;
  const dx = e.changedTouches[0].clientX - tx; tx = null;
  if (Math.abs(dx) > 60) go(dx < 0 ? 1 : -1);
}, {passive:true});

window.addEventListener('hashchange', route);
renderHome();
route();
</script>
